<!doctype html><meta charset="utf-8"><title>Cache diagnostic</title>
<style>body{background:#000;color:#fff;font:16px Arial;padding:24px}li{margin:10px 0}.ok{color:#8f8}.bad{color:#f88}</style>
<h1>Diagnóstico de caché</h1><ul id=r></ul>
<script>
const r=document.getElementById("r");
function add(n,v,ok){let x=document.createElement("li");x.className=ok?"ok":"bad";x.textContent=n+": "+v;r.appendChild(x)}
add("Online",navigator.onLine,true);
add("Cache Storage","caches" in window,"caches" in window);
add("Service Worker","serviceWorker" in navigator,"serviceWorker" in navigator);
if("serviceWorker" in navigator) navigator.serviceWorker.getRegistration().then(x=>add("Registro",!!x,!!x));
if("caches" in window)caches.open("app-incremental-cache-v1").then(async c=>add("Recursos almacenados",(await c.keys()).length,true)).catch(e=>add("Cache",e,false));
</script>
