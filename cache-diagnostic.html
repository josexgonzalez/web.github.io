<!doctype html><meta charset="utf-8"><title>Cache diagnostic</title>
<style>body{background:#000;color:#fff;font:16px Arial;padding:24px}li{margin:10px 0}.ok{color:#8f8}.bad{color:#f88}</style>
<h1>Diagnóstico de caché</h1><ul id=r></ul><script>
const r=document.getElementById("r");
function a(n,v,o){let x=document.createElement("li");x.className=o?"ok":"bad";x.textContent=n+": "+v;r.appendChild(x)}
a("Online",navigator.onLine,true);a("AppCache","applicationCache" in window,"applicationCache" in window);
a("Cache Storage","caches" in window,"caches" in window);a("IndexedDB","indexedDB" in window,"indexedDB" in window);a("Service Worker","serviceWorker" in navigator,"serviceWorker" in navigator);
if("caches"in window)caches.open("app-full-hybrid-v1").then(async c=>a("Entradas",(await c.keys()).length,true));
</script>
