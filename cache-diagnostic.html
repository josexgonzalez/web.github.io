<!doctype html>
<html><head><meta charset="utf-8"><title>PS5 cache diagnostic</title>
<style>body{background:#000;color:#fff;font:16px Arial;padding:24px}li{margin:10px 0}.ok{color:#8f8}.bad{color:#f88}</style>
</head><body><h1>Cache diagnostic</h1><ul id="r"></ul>
<script>
const r=document.getElementById("r");
function row(name,value,ok){const li=document.createElement("li");li.className=ok?"ok":"bad";li.textContent=name+": "+value;r.appendChild(li)}
row("navigator.onLine",navigator.onLine, true);
row("Cache Storage", "caches" in window, "caches" in window);
row("Service Worker API", "serviceWorker" in navigator, "serviceWorker" in navigator);
if("caches" in window){caches.open("ps5-hybrid-cache-v1").then(async c=>{
  row("Cache abierta",true,true);
  row("Entradas guardadas", (await c.keys()).length, true);
}).catch(e=>row("Cache abierta",false,false))}
</script></body></html>
