<script id="incremental-cache-controller">
(async function(){
"use strict";
const READY_KEY="APP_INCREMENTAL_CACHE_READY";
let overlay,title,status,bar,pct,detail;

function ui(){
  const st=document.createElement("style");
  st.id="incremental-cache-style";

  #inc-cache-pct{margin-top:10px;font-size:14px;opacity:.8}
  #inc-cache-detail{margin-top:12px;font-size:13px;opacity:.7}`;
  document.documentElement.appendChild(st);

  overlay=document.createElement("div");
  overlay.id="inc-cache-overlay";
  overlay.innerHTML=`
    <div id="inc-cache-box">
      <div id="inc-cache-title">Creando cache...</div>
      <div id="inc-cache-status">Comprobando recursos</div>
      <div id="inc-cache-track"><div id="inc-cache-bar"></div></div>
      <div id="inc-cache-pct">0%</div>
      <div id="inc-cache-detail"></div>
    </div>`;
  document.documentElement.appendChild(overlay);
  title=document.getElementById("inc-cache-title");
  status=document.getElementById("inc-cache-status");
  bar=document.getElementById("inc-cache-bar");
  pct=document.getElementById("inc-cache-pct");
  detail=document.getElementById("inc-cache-detail");
}
function progress(n,t,d=""){
  bar.style.width=n+"%"; pct.textContent=Math.round(n)+"%";
  status.textContent=t; detail.textContent=d;
}
function closeUI(){
  if(overlay) overlay.remove();
  const s=document.getElementById("incremental-cache-style");
  if(s) s.remove();
}

  const manifest=await fetch("cache-manifest.json",{cache:"no-store"}).then(r=>r.json());

  // Offline: never try to refresh. Existing service worker/cache can serve it.

    title.textContent="Cache incompleta";
