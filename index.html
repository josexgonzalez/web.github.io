<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Loader</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #111;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            width: 75%;
            height: 85%;
            background: #000;
            border: 3px solid #555;
            border-radius: 10px;
            overflow: hidden;
        }

        .titulo {
            width: 100%;
            height: 35px;
            background: #222;
            color: white;
            line-height: 35px;
            padding-left: 15px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        iframe {
            width: 100%;
            height: calc(100% - 35px);
            border: 0;
            display: block;
        }

        .enlace {
            position: fixed;
            bottom: 10px;
            left: 10px;
            color: white;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <div class="titulo">
            Aplicación local
        </div>

        <iframe
            src="http://127.0.0.1:18181/app/index.html">
        </iframe>

    </div>

    <a class="enlace"
       href="http://127.0.0.1:18181/app/index.html">
       Abrir directamente
    </a>

</body>
</html>
