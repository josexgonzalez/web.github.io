<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W2JB</title>

<script>
(function () {
    var redirected = false;

    function start() {
        if (redirected) return;
        redirected = true;

        location.replace(
            "slopkit/poops.html?go=1&auto=1&trigger=netcontrol&payload=1&v=lite1"
        );
    }

    // AppCache: esperar hasta que todos los archivos estén descargados
    if (window.applicationCache) {

        applicationCache.addEventListener("cached", function () {
            start();
        });

        applicationCache.addEventListener("updateready", function () {
            start();
        });

        applicationCache.addEventListener("noupdate", function () {
            start();
        });

        applicationCache.addEventListener("error", function () {
            console.log("AppCache error");
        });

        // Si ya está completamente cacheado
        if (applicationCache.status === applicationCache.IDLE) {
            start();
        }

    } else {
        // Si AppCache no existe
        start();
    }
})();
</script>

</head>

<body style="
    margin:0;
    background:#000;
    color:#9ab;
    font:14px/1.4 monospace;
    padding:16px
">

<div id="status">Caching files…</div>

<noscript>
    <p>
        <a href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=lite1">
            Start
        </a>
    </p>
</noscript>

</body>
</html>
