<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake — Nokia</title>
<style>
  html,body{margin:0;height:100%;background:#111;font-family:Arial,sans-serif}
  body{display:flex;align-items:center;justify-content:center}
  .phone{width:min(92vw,430px);background:#777;border:10px solid #333;border-radius:28px;padding:22px 18px 28px;box-shadow:0 20px 50px #000}
  .brand{text-align:center;font-weight:bold;font-size:26px;color:#ddd;letter-spacing:3px;margin-bottom:12px}
  .screen{background:#9bbc0f;border:12px solid #222;box-shadow:inset 0 0 0 3px #6b7f0b;aspect-ratio:1/1;position:relative}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
  .info{display:flex;justify-content:space-between;color:#ddd;font-weight:bold;font-family:monospace;font-size:18px;padding:12px 4px}
  .controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:10px auto 0}
  button{height:52px;border:0;border-radius:8px;background:#222;color:#ddd;font-size:22px;font-weight:bold;cursor:pointer;box-shadow:0 4px #111}
  button:active{transform:translateY(3px);box-shadow:0 1px #111}
  .empty{visibility:hidden}
  .hint{text-align:center;color:#bbb;font-size:12px;margin-top:16px}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">NOKIA</div>
  <div class="screen"><canvas id="game" width="240" height="240"></canvas></div>
  <div class="info"><span>SCORE: <b id="score">0</b></span><span id="status">READY</span></div>
  <div class="controls">
    <button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button>
    <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
  </div>
  <div class="hint">Flechas / WASD · ESPACIO para iniciar o reiniciar</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),statusEl=document.getElementById("status");
const cells=20,size=12;
let snake,food,dir,nextDir,score,running,timer;

function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  food=randomFood(); dir={x:1,y:0}; nextDir=dir;
  score=0; running=false; clearInterval(timer);
  scoreEl.textContent=score; statusEl.textContent="READY"; draw();
}
function randomFood(){
  let p;
  do p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};
  while(snake && snake.some(s=>s.x===p.x&&s.y===p.y));
  return p;
}
function start(){
  if(running)return;
  running=true; statusEl.textContent="PLAY";
  clearInterval(timer); timer=setInterval(tick,125);
}
function gameOver(){
  running=false; clearInterval(timer); statusEl.textContent="GAME OVER"; draw(true);
}
function tick(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||
     snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++; scoreEl.textContent=score; food=randomFood();
  }else snake.pop();
  draw();
}
function draw(over=false){
  ctx.fillStyle="#9bbc0f";ctx.fillRect(0,0,240,240);
  ctx.fillStyle="#0f380f";
  ctx.fillRect(food.x*size+2,food.y*size+2,size-4,size-4);
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?"#0b300b":"#306230";
    ctx.fillRect(s.x*size+1,s.y*size+1,size-2,size-2);
  });
  if(over){
    ctx.fillStyle="rgba(155,188,15,.82)";ctx.fillRect(30,94,180,52);
    ctx.fillStyle="#0f380f";ctx.font="bold 16px monospace";ctx.textAlign="center";
    ctx.fillText("GAME OVER",120,116);ctx.font="12px monospace";ctx.fillText("SPACE = RESTART",120,134);
  }
}
function setDir(d){
  const map={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
  const n=map[d];
  if(n.x===-dir.x&&n.y===-dir.y)return;
  nextDir=n; start();
}
document.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowup","w"].includes(k))setDir("up");
  else if(["arrowdown","s"].includes(k))setDir("down");
  else if(["arrowleft","a"].includes(k))setDir("left");
  else if(["arrowright","d"].includes(k))setDir("right");
  else if(e.code==="Space"){e.preventDefault(); if(running)reset(); else start();}
});
document.querySelectorAll("button[data-dir]").forEach(b=>{
  b.addEventListener("click",()=>setDir(b.dataset.dir));
});
reset();
</script>
</body>
</html>
