async function build(){

  // If this exact cache was already completed, do not rebuild it.
  if(marked()){ closeUI(); return; }

  if(!("caches" in window)){
    status.textContent="Cache Storage no disponible";
    setTimeout(closeUI,1200);

  var total=RESOURCES.length;
  var done=0;

  progress(0,"Preparando "+total+" recursos...");

  for(var i=0;i<total;i++){
    var path=RESOURCES[i];
    var url=new URL(path,location.href).href;
    try{

      var hit=await cache.match(url);
      if(!hit){
        var response=await fetch(url,{cache:"reload"});
        if(response.ok) await cache.put(url,response.clone());

    done++;
    progress((done/total)*100,"Guardando recurso "+done+" de "+total);
    // Yield so the progress display actually paints on WebKit.
    await new Promise(function(r){setTimeout(r,0)});
  }

  finish();
}
