  status=document.getElementById("ps5-sw-status");
  bar=document.getElementById("ps5-sw-bar");
  pct=document.getElementById("ps5-sw-pct");
}
function prog(n,t){if(bar)bar.style.width=n+"%";if(pct)pct.textContent=n+"%";if(status)status.textContent=t}
function closeUI(){if(overlay)overlay.remove();var s=document.getElementById("ps5-sw-cache-style");if(s)s.remove();overlay=null}
function ready(){try{localStorage.setItem(READY_KEY,CACHE_VERSION)}catch(e){};prog(100,"Cache creada correctamente");title.textContent="Cache terminada";setTimeout(closeUI,700)}
function marked(){try{return localStorage.getItem(READY_KEY)===CACHE_VERSION}catch(e){return false}}

function start(){

  var offline=navigator.onLine===false;

  // Offline and already controlled: use the service worker immediately.
  if(offline && navigator.serviceWorker.controller){ closeUI(); return; }

  // Offline before first installation: there is nothing to build.
  if(offline){ closeUI(); return; }

  // If the service worker already controls this page, cache was installed.
  if(navigator.serviceWorker.controller && marked()){ closeUI(); return; }

  ui(); prog(5,"Registrando cache offline...");

  navigator.serviceWorker.register("sw.js",{scope:"./"}).then(function(reg){
    prog(15,"Descargando recursos...");
    var worker=reg.installing||reg.waiting||reg.active;

    function watch(w){
      if(!w)return;
      if(w.state==="installed"){
        if(navigator.serviceWorker.controller){
          prog(95,"Activando cache...");
          setTimeout(ready,200);

          prog(95,"Activando cache...");
          // skipWaiting/clients.claim will control the page. Reload once so
          // all future requests are intercepted by the worker.
          setTimeout(function(){
            try{localStorage.setItem(READY_KEY,CACHE_VERSION)}catch(e){}

      w.addEventListener("statechange",function(){watch(w)}, {once:true});

    watch(worker);

    // If this is an already-active registration but this page wasn't yet
    // controlled, reload once to establish control.
    if(reg.active && !navigator.serviceWorker.controller){
      prog(90,"Activando cache...");
      setTimeout(function(){location.reload()},300);
    }

    // Do not block the launcher if this WebKit build lacks SW support.
    closeUI();
  });
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",start);
else start();
})();
