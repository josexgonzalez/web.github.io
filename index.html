<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake — Nokia</title>
<style>
html,body{margin:0;height:100%;background:#111}
body{display:flex;align-items:center;justify-content:center}
.phone{width:min(92vw,430px);background:#777;border:10px solid #333;border-radius:28px;padding:22px 18px 28px;box-shadow:0 20px 50px #000}
.brand{text-align:center;font:bold 26px Arial;color:#ddd;letter-spacing:3px;margin-bottom:12px}
.screen{background:#9bbc0f;border:12px solid #222;aspect-ratio:1/1}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
.info{display:flex;justify-content:space-between;color:#ddd;font:bold 18px monospace;padding:12px 4px}
.hint{text-align:center;color:#bbb;font:12px Arial;margin-top:12px}
</style>
</head>
<body>
<div class="phone">
  <div class="brand">NOKIA</div>
  <div class="screen"><canvas id="game" width="240" height="240"></canvas></div>
  <div class="info"><span>SCORE: <b id="score">0</b></span><span id="status">READY</span></div>
  <div class="hint">D-Pad / Stick · ✕ iniciar · OPTIONS reiniciar</div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const scoreEl=document.getElementById("score"),statusEl=document.getElementById("status");
const cells=20,size=12;
let snake,food,dir,nextDir,score,running,timer,lastPad=0;

function reset(){
  clearInterval(timer);
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0}; nextDir={x:1,y:0};
  score=0; running=false;
  scoreEl.textContent=0; statusEl.textContent="READY";
  food=randomFood(); draw();
}
function randomFood(){
  let p;
  do p={x:Math.floor(Math.random()*cells),y:Math.floor(Math.random()*cells)};
  while(snake.some(s=>s.x===p.x&&s.y===p.y));
  return p;
}
function start(){
  if(running)return;
  running=true; statusEl.textContent="PLAY";
  clearInterval(timer); timer=setInterval(tick,125);
}
function over(){
  running=false; clearInterval(timer);
  statusEl.textContent="GAME OVER"; draw(true);
}
function tick(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=cells||head.y<0||head.y>=cells||
     snake.some(s=>s.x===head.x&&s.y===head.y)){over();return}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++; scoreEl.textContent=score; food=randomFood();
  }else snake.pop();
  draw();
}
function draw(gameOver=false){
  ctx.fillStyle="#9bbc0f";ctx.fillRect(0,0,240,240);
  ctx.fillStyle="#0f380f";
  ctx.fillRect(food.x*size+2,food.y*size+2,size-4,size-4);
  snake.forEach((s,i)=>{
    ctx.fillStyle=i===0?"#0b300b":"#306230";
    ctx.fillRect(s.x*size+1,s.y*size+1,size-2,size-2);
  });
  if(gameOver){
    ctx.fillStyle="rgba(155,188,15,.85)";ctx.fillRect(25,92,190,56);
    ctx.fillStyle="#0f380f";ctx.textAlign="center";
    ctx.font="bold 16px monospace";ctx.fillText("GAME OVER",120,115);
    ctx.font="11px monospace";ctx.fillText("✕ = RESTART",120,135);
  }
}
function setDir(x,y){
  if(x===-dir.x&&y===-dir.y)return;
  nextDir={x,y}; start();
}
function readGamepad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  const p=pads[0];
  if(!p){requestAnimationFrame(readGamepad);return}
  const now=performance.now();
  if(now-lastPad>90){
    const ax=p.axes||[];
    const left=p.buttons[14]?.pressed, right=p.buttons[15]?.pressed;
    const up=p.buttons[12]?.pressed, down=p.buttons[13]?.pressed;
    if(up || ax[1]<-.5)setDir(0,-1);
    else if(down || ax[1]>.5)setDir(0,1);
    else if(left || ax[0]<-.5)setDir(-1,0);
    else if(right || ax[0]>.5)setDir(1,0);
    if(p.buttons[0]?.pressed){
      if(!running)start();
    }
    if(p.buttons[9]?.pressed){
      reset();
    }
    lastPad=now;
  }
  requestAnimationFrame(readGamepad);
}
window.addEventListener("gamepadconnected",()=>{statusEl.textContent="READY"});
reset();
readGamepad();
</script>
</body>
</html>
