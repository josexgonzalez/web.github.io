function show(){

  st.id="ps5-hybrid-style";
  st.textContent=
    "#ps5-hybrid-overlay{position:fixed;inset:0;z-index:2147483647;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif}" +

  document.documentElement.appendChild(st);
  ui=document.createElement("div");
  ui.id="ps5-hybrid-overlay";
  ui.innerHTML='<div id="ps5-hybrid-box"><div id="ps5-hybrid-title">Creando cache...</div><div id="ps5-hybrid-status">Preparando</div><div id="ps5-hybrid-track"><div id="ps5-hybrid-bar"></div></div><div id="ps5-hybrid-pct">0%</div><div id="ps5-hybrid-check"></div></div>';
  document.documentElement.appendChild(ui);
  title=document.getElementById("ps5-hybrid-title");
  status=document.getElementById("ps5-hybrid-status");
  bar=document.getElementById("ps5-hybrid-bar");
  pct=document.getElementById("ps5-hybrid-pct");
}
function progress(n,t){
  bar.style.width=n+"%"; pct.textContent=Math.round(n)+"%"; status.textContent=t;
}
function closeUI(){
  if(ui)ui.remove();
  var s=document.getElementById("ps5-hybrid-style"); if(s)s.remove();
}
function mark(){
  try{localStorage.setItem(READY,"1")}catch(e){}
}
function alreadyReady(){
  try{return localStorage.getItem(READY)==="1"}catch(e){return false}
}

async function verify(cache){
  var missing=[];
  for(var i=0;i<RESOURCES.length;i++){
    var url=new URL(RESOURCES[i],location.href).href;
    if(!(await cache.match(url))) missing.push(RESOURCES[i]);
  }
  return missing;
}

async function run(){
  // Offline: never rebuild. The existing cache is the only source.
  if(navigator.onLine===false){
    closeUI();
    return;
  }

  show();

  var swOK=("serviceWorker" in navigator);
  document.getElementById("ps5-hybrid-check").textContent=
    "Cache Storage: comprobando · Service Worker: "+(swOK?"disponible":"no disponible");

  if(!("caches" in window)){
    title.textContent="Cache no disponible";
    status.textContent="Cache Storage no está disponible en este WebKit";
    return;
  }

  var cache=await caches.open(CACHE);

  // Always refresh while online.
  var total=RESOURCES.length;
  var failures=0;

  for(var i=0;i<total;i++){
    var item=RESOURCES[i];
    var url=new URL(item,location.href).href;
    try{
      await cache.delete(url);
      var r=await fetch(url,{cache:"no-store"});
      if(!r.ok) throw new Error("HTTP "+r.status);
      await cache.put(url,r.clone());
    }catch(e){
      failures++;
    }
    progress(((i+1)/total)*85,"Guardando recurso "+(i+1)+" de "+total);
    await new Promise(function(r){setTimeout(r,0)});
  }

  progress(88,"Comprobando cache...");
  var missing=await verify(cache);

  // A resource is considered complete only if it is actually present.
  if(missing.length===0 && failures===0){
    progress(94,"Verificando almacenamiento...");
    if(swOK){
      try{
        await navigator.serviceWorker.register("sw.js",{scope:"./"});
      }catch(e){}
    }
    mark();
    progress(100,"Todos los recursos verificados");
    title.textContent="Cache terminada";
    status.textContent="Cache completa y lista para uso offline";
    setTimeout(closeUI,1000);
  }else{
    title.textContent="Cache incompleta";
    status.textContent="No se guardaron todos los recursos ("+missing.length+" faltantes)";
    document.getElementById("ps5-hybrid-check").textContent=
      "No se continuará como si la cache estuviera completa.";
    // Do not mark READY. The next online launch retries.
  }
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);
else run();
})();
