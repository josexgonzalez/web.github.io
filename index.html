<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hub Preview</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #000;
        }
    </style>
</head>
<body>

<video
    autoplay
    muted
    loop
    playsinline
    preload="auto">
    <source src="dynamic_background.mp4" type="video/mp4">
    Tu navegador no soporta vídeo HTML5.
</video>

<script>
const video = document.querySelector("video");

// Intenta reproducir automáticamente
video.play().catch(() => {
    document.addEventListener("click", () => {
        video.play();
    }, { once: true });
});
</script>

</body>
</html>
